services:
  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    image: golf-swing-ml:latest
    restart: unless-stopped
    volumes:
      # Only persist annotated videos — weights are baked into the image at build time
      - ml_output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
      # Keep threads low on small VPS to avoid RAM thrash; raise on ≥4GB hosts
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - TORCH_NUM_THREADS=1
    # Cap below host RAM so other containers (nginx/frontend) still fit on 2GB VPS
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: golf-swing-backend:latest
    restart: unless-stopped
    depends_on:
      ml-engine:
        condition: service_healthy
    environment:
      PORT: "3000"
      ML_ENGINE_URL: http://ml-engine:8000
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TEMP_DIR: /tmp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: golf-swing-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      BACKEND_URL: http://backend:3000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  # Issues/renews Let's Encrypt certs (webroot). First run: ./scripts/setup-ssl.sh
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c
    command:
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet || true
          sleep 12h &
          wait $${!}
        done

volumes:
  ml_output:
  certbot_www:
  certbot_certs:
